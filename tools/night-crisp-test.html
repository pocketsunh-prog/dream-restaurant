<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Night Interior Pixel Sampling</title>
</head>
<body style="background:#20242d;color:#cfe8d0;font:14px Consolas,monospace;padding:20px;margin:0">
<pre id="out" style="white-space:pre-wrap">initializing…</pre>
<canvas id="cNight" width="1280" height="800" style="display:none"></canvas>
<canvas id="cNoon" width="1280" height="800" style="display:none"></canvas>
<script type="module">
import { createNewGame } from '../src/core/state.js';
import { reduce } from '../src/core/actions.js';
import { FloorRenderer } from '../src/render/floor.js';
import { roomSilhouette } from '../src/render/iso.js';

const out = document.getElementById('out');
const lines = [];
try {
const state = createNewGame(20240101);
reduce(state, { type: 'START_DAY' });

const view = { frame: 0, tick: 0, showGrid: false, fx: { pools: true, shadows: false, ao: false, vignette: false, outsideShade: false, shafts: false } };

function render(minute) {
  state.minute = minute;
  const canvas = document.getElementById(minute === 12 * 60 ? 'cNoon' : 'cNight');
  new FloorRenderer(canvas).render(state, view);
  return canvas.getContext('2d').getImageData(0, 0, 1280, 800).data;
}

const noon = render(12 * 60);
const night = render(22 * 60);
const evening = render(17 * 60);
const morning = render(8 * 60);

const gridW = state.layout.gridW, gridH = state.layout.gridH;
const r = new FloorRenderer(document.getElementById('cNight'));
const wallH = r.wallHeight, ox = r.originX, oy = r.originY;
const poly = roomSilhouette(gridW, gridH, wallH, ox, oy);
let pcx = 0, pcy = 0;
for (const p of poly) { pcx += p.x; pcy += p.y; }
pcx /= poly.length; pcy /= poly.length;
function inPoly(px, py) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i].x, yi = poly[i].y, xj = poly[j].x, yj = poly[j].y;
    if (((yi > py) !== (yj > py)) && (px < ((xj - xi) * (py - yi)) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}

const todData = {
  'evening 17:00': evening,
  'night 22:00': night,
  'morning 08:00': morning
};
lines.push('=== Interior pixel sampling: each TOD vs noon (12:00) ===');
lines.push('Room centroid: ' + pcx.toFixed(0) + ',' + pcy.toFixed(0));
let allPass = true;
for (const [name, data] of Object.entries(todData)) {
  let cDiff = 0, cTotal = 0, cDark = 0, cBright = 0, eDiff = 0, eTotal = 0;
  for (let y = 0; y < 800; y += 1) {
    for (let x = 0; x < 1280; x += 1) {
      if (!inPoly(x, y)) continue;
      const i = (y * 1280 + x) * 4;
      const d = Math.abs(noon[i] - data[i]) + Math.abs(noon[i + 1] - data[i + 1]) + Math.abs(noon[i + 2] - data[i + 2]);
      const lumSam = data[i] + data[i + 1] + data[i + 2];
      const lumNoon = noon[i] + noon[i + 1] + noon[i + 2];
      const dist = Math.sqrt((x - pcx) ** 2 + (y - pcy) ** 2);
      if (dist < 180) { cTotal++; if (d > 6) { cDiff++; if (lumSam > lumNoon) cBright++; else cDark++; } }
      else { eTotal++; if (d > 6) eDiff++; }
    }
  }
  const darkerPct = cTotal ? (100 * cDark / cTotal).toFixed(2) : 0;
  const pass = cDark < cTotal * 0.02;
  if (!pass) allPass = false;
  lines.push(name + ': centerDiff=' + cDiff + ' DARKER=' + cDark + ' (' + darkerPct + '%) ' + (pass ? 'PASS' : 'FAIL'));
  console.log('TOD ' + name + ': centerDarker=' + cDark + '/' + cTotal + ' (' + darkerPct + '%)');
}
lines.push('');
lines.push(allPass ? 'ALL PASS: center never darkened by dither at any TOD' : 'FAIL: some TOD darkens center');
out.textContent = lines.join('\n');
} catch (err) {
  document.getElementById('out').textContent = 'ERROR: ' + err.message + '\n' + err.stack;
}
</script>
</body>
</html>
