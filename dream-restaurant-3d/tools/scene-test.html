<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>3D 場景驗證 — Dream Restaurant 3D</title>
<style>
  body { background: #14110f; color: #f3ece0; font: 13px/1.7 Consolas, monospace; margin: 0; padding: 14px; }
  h1 { font-size: 15px; color: #c9a227; margin: 0 0 8px; }
  pre { white-space: pre-wrap; margin: 0; }
  #cv { width: 640px; height: 400px; border: 1px solid #555; display: block; margin-top: 10px; }
  .pass { color: #8ef0a0; } .fail { color: #ff9090; } .info { color: #9fb0c4; }
</style>
</head>
<body>
<h1>Dream Restaurant 3D — scene / data / sim 驗證</h1>
<pre id="out">running…</pre>
<canvas id="cv" width="640" height="400"></canvas>
<script type="importmap">
{ "imports": {
  "three": "../vendor/three.module.js",
  "three/addons/environments/RoomEnvironment.js": "../vendor/RoomEnvironment.js"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { LOCATIONS, locationById, locationsForStars, REGIONS } from '../src/data/locations.js';
import { DISHES, dishById, CATEGORIES } from '../src/data/dishes.js';
import * as Props from '../src/scene/props.js';
import * as Chars from '../src/scene/characters.js';
import { createLighting } from '../src/scene/lighting.js';
import { RestaurantView, propStats } from '../src/scene/restaurant.js';
import { createGame, tick, settleDay, startNextDay, resolveSpecialties, seatsOfPlan } from '../src/sim/game.js';

const out = document.getElementById('out');
const L = [];
let fails = 0;
const say = (t) => L.push(t);
const check = (name, ok, detail = '') => {
  if (!ok) fails++;
  L.push(`  ${ok ? 'PASS' : 'FAIL'}  ${name}${detail ? ' :: ' + detail : ''}`);
};

/* ── 1. 資料 ───────────────────────────────────────────── */
say('=== [1] 資料集 ===');
check('locations 28 筆', LOCATIONS.length === 28, `${LOCATIONS.length}`);
check('location id 唯一', new Set(LOCATIONS.map((l) => l.id)).size === LOCATIONS.length);
check('customerMix 合計 100', LOCATIONS.every((l) => Object.values(l.customerMix).reduce((a, b) => a + b, 0) === 100));
check('weather 合計 100', LOCATIONS.every((l) => Object.values(l.weather).reduce((a, b) => a + b, 0) === 100));
check('REGIONS 9 個', REGIONS.length === 9, REGIONS.join('/'));
check('dishes 44 筆', DISHES.length === 44, `${DISHES.length}`);
check('dish 價格倍率 2.8~4.2', DISHES.every((d) => d.price >= d.cost * 2.8 && d.price <= d.cost * 4.2));
check('每地點名物都可解析', LOCATIONS.every((l) => resolveSpecialties(l).length > 0),
  LOCATIONS.map((l) => resolveSpecialties(l).length).join(','));

/* ── 2. 道具庫 ─────────────────────────────────────────── */
say('');
say('=== [2] 道具庫 / 人物 ===');
const NEED = ['woodFloor', 'tatami', 'pillar', 'beam', 'shoji', 'noren', 'engawa', 'chabudai', 'zabuton',
  'table', 'chair', 'counter', 'kitchenCounter', 'stove', 'sink', 'fridge', 'shelf', 'tableSetting',
  'chochin', 'andon', 'kakemono', 'bonsai', 'ikebana', 'bamboo', 'manekiNeko', 'sakeBarrel', 'signboard', 'neonSign', 'plantPot'];
const upper = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const missing = NEED.filter((n) => typeof Props['make' + upper(n)] !== 'function');
check('道具 builder 齊全', missing.length === 0,
  missing.length ? '缺少 ' + missing.join(',') : `PROP_IDS ${(Props.PROP_IDS || []).length}`);
let propFail = [];
for (const id of (Props.PROP_IDS || [])) {
  try { const g = Props.makeProp(id, {}); if (!g || !g.isObject3D) propFail.push(id); } catch { propFail.push(id); }
}
check('makeProp 全部可建立', propFail.length === 0, propFail.join(',') || `${(Props.PROP_IDS || []).length} 種`);
const c1 = Chars.makeCharacter({ kind: 'office', seed: 42 });
check('人物可建立', !!c1 && c1.isObject3D);
check('人物有骨架 parts', !!(c1?.userData?.parts?.head && c1?.userData?.parts?.hips));
let poseOk = true;
try { for (const p of ['stand', 'walk', 'sit', 'eat', 'wait', 'angry', 'happy']) Chars.setPose(c1, p, 1.0); } catch { poseOk = false; }
check('7 種姿勢可用', poseOk);
let meshPerChar = 0; c1.traverse((o) => { if (o.isMesh) meshPerChar++; });
check('單一人物 mesh 數 <= 60', meshPerChar <= 60, `${meshPerChar}`);

/* ── 3. 場景 ───────────────────────────────────────────── */
say('');
say('=== [3] 場景 ===');
const canvas = document.getElementById('cv');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(1);
renderer.setSize(640, 400, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(46, 1.6, 0.1, 400);
const lighting = createLighting(scene, renderer);
const game = createGame({ locationId: 'tokyo_shibuya', seed: 20240601 });
const view = new RestaurantView(scene, game.plan);
scene.add(new THREE.AmbientLight(0xffffff, 0.001));

let meshes = 0, nanBox = 0, casters = 0;
scene.traverse((o) => {
  if (!o.isMesh) return;
  meshes++;
  if (o.castShadow) casters++;
  const p = o.position;
  if (!Number.isFinite(p.x) || !Number.isFinite(p.y) || !Number.isFinite(p.z)) nanBox++;
});
check('場景 mesh 數 > 250', meshes > 250, `${meshes}（投影 ${casters}）`);
check('沒有 NaN 座標', nanBox === 0, `${nanBox}`);
check('房間外殼存在', !!view.shell, view.shell ? view.shell.children.length + ' 面' : '無');
check('桌子數與平面一致', view.tableProps.length === game.plan.tables.length, `${view.tableProps.length}`);
check('座位數 36', seatsOfPlan(game.plan) === 36, `${seatsOfPlan(game.plan)}`);
check('沒有道具退回佔位幾何', propStats.fallback === 0,
  propStats.fallback === 0 ? `成功建立 ${propStats.ok} 件` : `退回 ${propStats.fallback} 件：${[...new Set(propStats.missing)].join(',')}`);

/* ── 4. 模擬 ───────────────────────────────────────────── */
say('');
say('=== [4] 模擬（快轉 12 小時）===');
let guard = 0;
while (game.phase !== 'settle' && guard++ < 1500) tick(game, 1);
const rep = settleDay(game);
check('有客人上門', rep.guests > 0, `${rep.guests} 人 / ${rep.groups} 組`);
check('有服務成功', rep.served > 0, `${rep.served} 人`);
check('營業額 > 0', rep.revenue > 0, `¥${rep.revenue.toLocaleString()}`);
check('現金為有限數', Number.isFinite(rep.cash), `¥${Math.round(rep.cash).toLocaleString()}`);
check('沒有 NaN 統計', [rep.served, rep.angry, rep.revenue, rep.cost, rep.net].every(Number.isFinite));
check('訂單與名物掛勾', Object.keys(rep.dishCount).length > 0, Object.keys(rep.dishCount).slice(0, 5).join(','));
startNextDay(game);
check('隔天可正常開始', game.phase === 'open' && game.day === 2);

/* ── 5. 渲染 ───────────────────────────────────────────── */
say('');
say('=== [5] 渲染（室內機位）===');
game.plan.tables.forEach((t, i) => { t.occupied = i < 4; });
for (let i = 0; i < 3; i++) tick(game, 1);
view.update(0.016, game);
camera.position.set(6.4, 5.2, 9.6);
camera.lookAt(0, 1.0, 0.4);
lighting.setWeather('sunny');
lighting.setTimeOfDay(12);
renderer.render(scene, camera);
const info = renderer.info.render;
check('draw calls < 3000', info.calls < 3000, `${info.calls}`);
check('triangles < 2.5M', info.triangles < 2_500_000, `${info.triangles.toLocaleString()}`);
check('有實際繪製內容', info.triangles > 5000, `${info.triangles.toLocaleString()}`);

// 夜晚
lighting.setTimeOfDay(21);
renderer.render(scene, camera);
check('夜晚可渲染', renderer.info.render.calls > 0, `lamps on=${lighting.state.isNight}`);
lighting.setTimeOfDay(12);

say('');
say(fails === 0 ? '<span class="pass">SCENE TEST: ALL PASSED</span>' : `<span class="fail">SCENE TEST: ${fails} FAILED</span>`);
out.innerHTML = L.join('\n');
document.title = fails === 0 ? 'SCENE-OK' : 'SCENE-FAIL-' + fails;
console.log('SCENE_TEST_RESULT fails=' + fails + ' meshes=' + meshes + ' calls=' + info.calls + ' tris=' + info.triangles);
</script>
</body>
</html>
