<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>3D 場景驗證 — Dream Restaurant 3D</title>
<style>
  body { background: #14110f; color: #f3ece0; font: 13px/1.7 Consolas, monospace; margin: 0; padding: 14px; }
  h1 { font-size: 15px; color: #c9a227; margin: 0 0 8px; }
  pre { white-space: pre-wrap; margin: 0; }
  #cv { width: 640px; height: 400px; border: 1px solid #555; display: block; margin-top: 10px; }
  .pass { color: #8ef0a0; } .fail { color: #ff9090; } .info { color: #9fb0c4; }
</style>
</head>
<body>
<h1>Dream Restaurant 3D — scene / data / sim 驗證</h1>
<pre id="out">running…</pre>
<canvas id="cv" width="640" height="400"></canvas>
<script>
// 例外也要看得到（無頭瀏覽器不方便看 console）
function __reportErr(kind, msg, stack) {
  const o = document.getElementById('out');
  if (o && o.textContent.trim().startsWith('running')) {
    o.textContent = `[${document.title}] ${kind}: ${msg}\n${stack || ''}`;
  }
  document.title = 'SCENE-ERR';
  console.log('SCENE_TEST_' + kind + ' ' + msg);
}
window.addEventListener('error', (e) => __reportErr('ERROR', e.message, e.error && e.error.stack));
window.addEventListener('unhandledrejection', (e) => __reportErr('REJECT', (e.reason && e.reason.message) || e.reason, e.reason && e.reason.stack));
</script>
<script type="importmap">
{ "imports": {
  "three": "../vendor/three.module.js",
  "three/addons/environments/RoomEnvironment.js": "../vendor/RoomEnvironment.js"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { LOCATIONS, locationById, locationsForStars, REGIONS } from '../src/data/locations.js';
import { DISHES, dishById, CATEGORIES } from '../src/data/dishes.js';
import * as Props from '../src/scene/props.js';
import * as Chars from '../src/scene/characters.js';
import { createLighting } from '../src/scene/lighting.js';
import { buildWeatherFx } from '../src/scene/weatherfx.js';
import { RestaurantView, propStats } from '../src/scene/restaurant.js';
import { createGame, tick, settleDay, startNextDay, resolveSpecialties, seatsOfPlan, money,
  hireStaff, fireStaff, candidateInfo, ROLE_LABEL, buyEquipment, repairEquipment,
  forceEvent, trafficMultiplier, setStaffUniform, topMenuReport, spawnGroup, allTables,
  kitchenReport, rankings, setFloorCount, setBusinessHours, setSetting,
  crowdInfo, findTable, setRoleUniform, CUSTOMER_KINDS, WEATHERS, WEATHER_JP, WEATHER_TRAFFIC,
  rollWeather, drainEvents, restroomDirt, setRestroomDirt, restroomList,
  restroomLevel, restroomLevelInfo, avgRestroomLevel, renovateRestroom, renovateFloorRestrooms } from '../src/sim/game.js';
import { STAFF_POOL } from '../src/data/staff.js';
import { MISSIONS } from '../src/data/missions.js';
import { missionReport, claimMission } from '../src/sim/missions.js';
import { serializeGame, deserializeGame, saveToSlot, loadFromSlot, slotInfo, deleteSlot, listSlots, storageAvailable } from '../src/sim/save.js';
import { EVENTS } from '../src/data/events.js';
import { UNIFORMS } from '../src/data/uniforms.js';

const out = document.getElementById('out');
const L = [];
let fails = 0;
const say = (t) => L.push(t);
// 進度標記寫進標題：無頭瀏覽器可以先 dump 標題看跑到哪一段
const stage = (t) => { document.title = 'STAGE ' + t; };
const check = (name, ok, detail = '') => {
  if (!ok) fails++;
  L.push(`  ${ok ? 'PASS' : 'FAIL'}  ${name}${detail ? ' :: ' + detail : ''}`);
};
stage('start');

/* ── 1. 資料 ───────────────────────────────────────────── */
say('=== [1] 資料集 ===');
check('locations 28 筆', LOCATIONS.length === 28, `${LOCATIONS.length}`);
check('location id 唯一', new Set(LOCATIONS.map((l) => l.id)).size === LOCATIONS.length);
check('customerMix 合計 100', LOCATIONS.every((l) => Object.values(l.customerMix).reduce((a, b) => a + b, 0) === 100));
check('weather 合計 100', LOCATIONS.every((l) => Object.values(l.weather).reduce((a, b) => a + b, 0) === 100));
check('REGIONS 9 個', REGIONS.length === 9, REGIONS.join('/'));
check('dishes 44 筆', DISHES.length === 44, `${DISHES.length}`);
check('dish 價格倍率 2.8~4.2', DISHES.every((d) => d.price >= d.cost * 2.8 && d.price <= d.cost * 4.2));
check('每地點名物都可解析', LOCATIONS.every((l) => resolveSpecialties(l).length > 0),
  LOCATIONS.map((l) => resolveSpecialties(l).length).join(','));

/* ── 2. 道具庫 ─────────────────────────────────────────── */
say('');
say('=== [2] 道具庫 / 人物 ===');
const NEED = ['woodFloor', 'tatami', 'pillar', 'beam', 'shoji', 'noren', 'engawa', 'chabudai', 'zabuton',
  'table', 'chair', 'counter', 'kitchenCounter', 'stove', 'sink', 'fridge', 'shelf', 'tableSetting',
  'chochin', 'andon', 'kakemono', 'bonsai', 'ikebana', 'bamboo', 'manekiNeko', 'sakeBarrel', 'signboard', 'neonSign', 'plantPot'];
const upper = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const missing = NEED.filter((n) => typeof Props['make' + upper(n)] !== 'function');
check('道具 builder 齊全', missing.length === 0,
  missing.length ? '缺少 ' + missing.join(',') : `PROP_IDS ${(Props.PROP_IDS || []).length}`);
let propFail = [];
for (const id of (Props.PROP_IDS || [])) {
  try { const g = Props.makeProp(id, {}); if (!g || !g.isObject3D) propFail.push(id); } catch { propFail.push(id); }
}
check('makeProp 全部可建立', propFail.length === 0, propFail.join(',') || `${(Props.PROP_IDS || []).length} 種`);
const c1 = Chars.makeCharacter({ kind: 'office', seed: 42 });
check('人物可建立', !!c1 && c1.isObject3D);
check('人物有骨架 parts', !!(c1?.userData?.parts?.head && c1?.userData?.parts?.hips));
let poseOk = true;
try { for (const p of ['stand', 'walk', 'sit', 'eat', 'wait', 'angry', 'happy', 'carry', 'cook']) Chars.setPose(c1, p, 1.0); } catch { poseOk = false; }
check('9 種姿勢可用', poseOk);
let meshPerChar = 0; c1.traverse((o) => { if (o.isMesh) meshPerChar++; });
check('單一人物 mesh 數 <= 60', meshPerChar <= 60, `${meshPerChar}`);

/* ── 3. 場景 ───────────────────────────────────────────── */
say('');
stage('sec3'); say('=== [3] 場景 ===');
const canvas = document.getElementById('cv');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(1);
renderer.setSize(640, 400, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(46, 1.6, 0.1, 400);
const lighting = createLighting(scene, renderer);
const game = createGame({ locationId: 'tokyo_shibuya', seed: 20240601 });
const view = new RestaurantView(scene, game.plan);
scene.add(new THREE.AmbientLight(0xffffff, 0.001));

let meshes = 0, nanBox = 0, casters = 0;
scene.traverse((o) => {
  if (!o.isMesh) return;
  meshes++;
  if (o.castShadow) casters++;
  const p = o.position;
  if (!Number.isFinite(p.x) || !Number.isFinite(p.y) || !Number.isFinite(p.z)) nanBox++;
});
check('場景 mesh 數 > 250', meshes > 250, `${meshes}（投影 ${casters}）`);
check('沒有 NaN 座標', nanBox === 0, `${nanBox}`);
check('房間外殼存在', !!(view.floorGroups && view.floorGroups.length), view.floorGroups ? view.floorGroups.length + ' 層' : '無');
check('桌子數與平面一致', view.tableProps.length === allTables(game.plan).length, `${view.tableProps.length}`);
check('座位數 36', seatsOfPlan(game.plan) === 36, `${seatsOfPlan(game.plan)}`);
check('一樓有調理場（爐台・出餐口・吧台）', !!(view.cookFx && view.burners?.length), `${view.burners?.length} 個爐口`);
check('調理標籤 sprite 已建立', Array.isArray(view.cookLabels) && view.cookLabels.length >= 2, `${view.cookLabels?.length}`);
check('候位動線（繩）已建立', !!view.queueLane, view.queueLane ? view.queueLane.children.length + ' 件' : '無');
check('沒有道具退回佔位幾何', propStats.fallback === 0,
  propStats.fallback === 0 ? `成功建立 ${propStats.ok} 件` : `退回 ${propStats.fallback} 件：${[...new Set(propStats.missing)].join(',')}`);
// 多樓層
check('預設 1 樓', game.plan.floorCount === 1, `${game.plan.floorCount}`);
check('一樓有桌子', game.plan.floorPlans[0].tables.length > 0, `${game.plan.floorPlans[0].tables.length} 張`);
check('桌子分散在各樓層', allTables(game.plan).length === game.plan.floorPlans.reduce((a, fp) => a + fp.tables.length, 0), `${allTables(game.plan).length}`);

/* ── 4. 模擬 ───────────────────────────────────────────── */
say('');
say('=== [4] 模擬（快轉 12 小時）===');
let guard = 0;
while (game.phase !== 'settle' && guard++ < 1500) tick(game, 1);
const rep = settleDay(game);
check('有客人上門', rep.guests > 0, `${rep.guests} 人 / ${rep.groups} 組`);
check('有服務成功', rep.served > 0, `${rep.served} 人`);
check('營業額 > 0', rep.revenue > 0, `¥${rep.revenue.toLocaleString()}`);
check('現金為有限數', Number.isFinite(rep.cash), `¥${Math.round(rep.cash).toLocaleString()}`);
check('沒有 NaN 統計', [rep.served, rep.angry, rep.revenue, rep.cost, rep.net].every(Number.isFinite));
check('訂單與名物掛勾', Object.keys(rep.dishCount).length > 0, Object.keys(rep.dishCount).slice(0, 5).join(','));
startNextDay(game);
check('隔天可正常開始', game.phase === 'open' && game.day === 2);

/* ── 5. 渲染 ───────────────────────────────────────────── */
say('');
say('=== [5] 渲染（室內機位）===');
allTables(game.plan).forEach((t, i) => { t.occupied = i < 4; });
for (let i = 0; i < 3; i++) tick(game, 1);
view.update(0.016, game);
camera.position.set(6.4, 5.2, 9.6);
camera.lookAt(0, 1.0, 0.4);
lighting.setWeather('sunny');
lighting.setTimeOfDay(12);
renderer.render(scene, camera);
const info = renderer.info.render;
check('draw calls < 3000', info.calls < 3000, `${info.calls}`);
check('triangles < 2.5M', info.triangles < 2_500_000, `${info.triangles.toLocaleString()}`);
check('有實際繪製內容', info.triangles > 5000, `${info.triangles.toLocaleString()}`);

// 夜晚
lighting.setTimeOfDay(21);
renderer.render(scene, camera);
check('夜晚可渲染', renderer.info.render.calls > 0, `lamps on=${lighting.state.isNight}`);
lighting.setTimeOfDay(12);

/* ── 7. 員工服務流程 ───────────────────────────────────────── */
say('');
stage('sec7'); say('=== [7] 員工與服務流程 ===');
{
  const g2 = createGame({ locationId: 'osaka_dotonbori', seed: 99 });
  check('開局有 1 料理人 + 1 ホール',
    g2.staff.filter((s) => s.role === 'chef').length === 1 && g2.staff.filter((s) => s.role === 'waiter').length === 1,
    g2.staff.map((s) => `${s.name}(${ROLE_LABEL[s.role]})`).join('、'));

  // 招募名單
  const before = g2.cash;
  const cands = candidateInfo(g2);
  check('招募名單有 3~5 人且星級合格',
    cands.length >= 3 && cands.every((c) => c.stars <= g2.stars), `${cands.length} 人`);
  const pick = cands.find((c) => g2.cash >= c.hireCost);
  if (pick) {
    const r = hireStaff(g2, pick.id);
    check('可以雇用員工', r.ok === true, r.ok ? `${pick.name}（${money(pick.hireCost)}）` : r.error);
    check('雇用會扣簽約金', g2.cash === before - pick.hireCost, `-${money(pick.hireCost)}`);
    check('員工數增加', g2.staff.length === 3, `${g2.staff.length} 人`);
  } else {
    check('可以雇用員工', false, '沒有付得起的應徵者');
  }
  const firstWaiter = g2.staff.find((s) => s.role === 'waiter');
  const lastChef = g2.staff.find((s) => s.role === 'chef');
  const fireChef = fireStaff(g2, lastChef.id);
  check('不能解雇最後一位料理人', fireChef.ok === false, fireChef.error || '');

  // 跑完整一天
  const seenTasks = new Set();
  let maxPass = 0;
  let maxQueue = 0;
  let restroomCleaned = false;
  let dirtPeak = 0;
  let guard2 = 0;
  while (g2.phase !== 'settle' && guard2++ < 3000) {
    tick(g2, 1);
    for (const t of g2.tasks) seenTasks.add(t.type);
    maxPass = Math.max(maxPass, g2.pass.length);
    maxQueue = Math.max(maxQueue, g2.queue.length);
    dirtPeak = Math.max(dirtPeak, g2.restroom.dirt);
    if (g2.restroom.dirt === 0 && dirtPeak > 5) restroomCleaned = true;
  }
  const rep2 = settleDay(g2);
  for (const k of ['seat', 'cook', 'deliver', 'collect', 'cleanTable']) {
    check(`任務「${k}」有被建立`, seenTasks.has(k), [...seenTasks].join(','));
  }
  check('有完成任務', rep2.tasksDone > 0, `${rep2.tasksDone} 件`);
  check('服務生完成結帳（有營業額）', rep2.revenue > 0, `¥${rep2.revenue.toLocaleString()}`);
  check('大部分客人有被服務', rep2.served > 0 && rep2.served >= rep2.angry,
    `服務 ${rep2.served} / 生氣 ${rep2.angry}`);
  check('出餐口有菜（廚師有放菜）', maxPass > 0, `同時最多 ${maxPass} 組`);
  check('出餐口的菜會被取走', g2.pass.length === 0 || g2.phase !== 'settle', `${g2.pass.length} 筆殘留`);
  check('人件費有算進結算', rep2.wages > 0, money(rep2.wages));
  void restroomCleaned; void maxQueue; void firstWaiter;
}

/* ── 8. 候位排隊 ───────────────────────────────────────────── */
say('');
say('=== [8] 候位排隊 ===');
{
  const g3 = createGame({ locationId: 'tokyo_shibuya', seed: 5 });
  // 把所有桌子佔滿 → 新客人應該去排隊
  for (const t of allTables(g3.plan)) { t.occupied = true; t.groupId = 'x'; }
  let guard3 = 0;
  while (g3.queue.length === 0 && guard3++ < 400) tick(g3, 1);
  check('沒位子時客人會排隊', g3.queue.length > 0, `候位 ${g3.queue.length} 組`);
  const queued = g3.groups.find((x) => x.state === 'queue');
  check('排隊中的客人狀態正確', !!queued && queued.wait >= 0);
  // 空出一張桌 → 應該有人被帶位
  const firstQueued = g3.groups.find((g) => g.state === 'queue');
  allTables(g3.plan)[0].occupied = false;
  allTables(g3.plan)[0].groupId = null;
  let guard4 = 0, sawSeatTask = false, gotTable = false;
  while (guard4++ < 120) {
    tick(g3, 1);
    if (g3.tasks.some((t) => t.type === 'seat')) sawSeatTask = true;
    if (firstQueued && firstQueued.tableId) gotTable = true;
  }
  check('有位子後會補位（帶位任務）', sawSeatTask || gotTable,
    `帶位任務 ${sawSeatTask ? '有' : '無'} / 第一位候位客 ${gotTable ? '已入座' : '還在等'}（其餘 ${g3.queue.length} 組）`);
}

/* ── 9. 事件系統 ───────────────────────────────────────────── */
say('');
say('=== [9] 事件 ===');
{
  const g4 = createGame({ locationId: 'kyoto_gion', seed: 21 });
  check('事件資料 50 筆', EVENTS.length >= 50, `${EVENTS.length}`);
  const ev = EVENTS.find((e) => e.id === 'tv_interview') || EVENTS[0];
  const trafficBefore = trafficMultiplier(g4, locationById(g4.locationId));
  const cashBefore = g4.cash;
  const res = forceEvent(g4, ev.id);
  check('可以觸發指定事件', res.ok === true, ev.name);
  const trafficAfter = trafficMultiplier(g4, locationById(g4.locationId));
  const applied = g4.eventLog.length > 0 && (
    (ev.effects.trafficMul && trafficAfter !== trafficBefore) ||
    (ev.effects.cash && g4.cash !== cashBefore) ||
    (ev.effects.fame && true)
  );
  check('事件效果有套用', applied,
    `traffic ${trafficBefore.toFixed(2)}→${trafficAfter.toFixed(2)}, cash ${g4.cash - cashBefore}`);
  check('事件寫進紀錄', g4.eventLog.length > 0, g4.eventLog[0]?.name || '');

  // 跑一段時間，應該會有事件自然發生
  let guard5 = 0, natural = 0;
  const logBefore = g4.eventLog.length;
  while (guard5++ < 600 && g4.phase === 'open') { tick(g4, 1); }
  natural = g4.eventLog.length - logBefore;
  check('營業中會隨機發生事件', natural > 0, `${natural} 件（600 分鐘內）`);

  // 設備減免
  const g5 = createGame({ locationId: 'tokyo_shibuya', seed: 33 });
  const mitEvent = EVENTS.find((e) => e.mitigateBy) || null;
  if (mitEvent) {
    const r1 = forceEvent(g5, mitEvent.id);
    check('有可減免的事件存在', r1.ok === true, `${mitEvent.name}（${mitEvent.mitigateBy}）`);
    const cashAfterNoEquip = g5.cash;
    // 買了設備後再觸發一次，減免應為一半
    g5.equipment.push(mitEvent.mitigateBy);
    forceEvent(g5, mitEvent.id);
    check('設備會標記減免', g5.eventLog[0].mitigated === true,
      `裝備 ${mitEvent.mitigateBy} → mitigated=${g5.eventLog[0].mitigated}`);
    void cashAfterNoEquip;
  }
  // 設備購買／修理
  const buy = buyEquipment(g5, 'cctv');
  check('可以購買設備', buy.ok === true || buy.error === '已經購入', buy.ok ? '監視器' : buy.error);
  g5.equipBroken.fridge = true;
  const rep = repairEquipment(g5, 'fridge');
  check('可以修理故障設備', rep.ok === true && g5.equipBroken.fridge === false, rep.ok ? money(rep.cost) : rep.error);
}

/* ── 10. 設定與存讀檔 ─────────────────────────────────────── */
say('');
stage('sec10'); say('=== [10] 設定・存讀檔 ===');
{
  check('localStorage 可用', storageAvailable());

  // 營業時間
  const g6 = createGame({ locationId: 'tokyo_shibuya', seed: 77 });
  const bad = setBusinessHours(g6, 20 * 60, 12 * 60);
  check('拒絕「打烊早於開店」', bad.ok === false, bad.error);
  const short = setBusinessHours(g6, 11 * 60, 12 * 60);
  check('拒絕「營業不足 2 小時」', short.ok === false, short.error);
  const good = setBusinessHours(g6, 10 * 60, 22 * 60);
  check('可以設定營業時間', good.ok === true, `10:00 → 22:00`);
  check('營業時間已寫入 state', g6.settings.openMinute === 600 && g6.settings.closeMinute === 1320);

  // 一般設定
  setSetting(g6, 'graphics.shadows', false);
  setSetting(g6, 'graphics.pixelRatio', '1');
  check('可以寫入畫質設定', g6.settings.graphics.shadows === false && g6.settings.graphics.pixelRatio === '1');

  // 存檔 → 改動 → 讀檔 → 應該回到存檔當下
  const rngBefore = g6.rng.state();
  const snapDay = g6.day, snapCash = g6.cash, snapLoc = g6.locationId;
  const sv = saveToSlot(g6, '1');
  check('可以存檔', sv.ok === true, `savedAt ${sv.savedAt ? 'ok' : 'missing'}`);
  const info = slotInfo('1');
  check('槽位摘要正確', !info.empty && info.day === snapDay && info.locationId === snapLoc && Math.round(info.cash) === Math.round(snapCash),
    `${info.day} 日目 / ${info.locationId} / ★${info.stars}`);
  // 破壞現況
  g6.cash = 12345; g6.day = 99; g6.locationId = 'kyoto_gion'; g6.staff.length = 0;
  const ld = loadFromSlot('1');
  check('可以讀檔', ld.ok === true, ld.error || '');
  const g7 = ld.state;
  check('讀檔還原日數與現金', g7.day === snapDay && Math.round(g7.cash) === Math.round(snapCash), `${g7.day} 日目 / ${money(g7.cash)}`);
  check('讀檔還原地點', g7.locationId === snapLoc, g7.locationId);
  check('讀檔還原員工', g7.staff.length === 2, `${g7.staff.length} 人`);
  check('讀檔還原亂數狀態', typeof g7.rng?.state === 'function' && g7.rng.state() === rngBefore, `${g7.rng.state()}`);
  check('讀檔後可繼續模擬', (() => { try { for (let i = 0; i < 30; i++) tick(g7, 1); return Number.isFinite(g7.cash); } catch { return false; } })(), `cash ${money(g7.cash)}`);
  check('讀檔還原設定', g7.settings.openMinute === 600 && g7.settings.graphics.shadows === false);

  // 刪除
  const del = deleteSlot('1');
  check('可以刪除存檔', del.ok && slotInfo('1').empty, '');
  check('槽位清單 6 個', listSlots().length === 6, listSlots().map((s) => s.id).join(','));

  // 自動存檔
  const as = saveToSlot(g7, 'auto');
  check('自動存檔槽可用', as.ok === true, 'auto');
  deleteSlot('auto');

  /* ── 主題 / 制服 / 顧客多樣化 ── */
  check('全部 28 地點都有 theme', LOCATIONS.every((l) => l.theme && l.theme.wall && l.theme.musicScale),
    `${LOCATIONS.filter((l) => l.theme).length}/28`);
  const uniqStyles = new Set(LOCATIONS.map((l) => l.theme?.style));
  check('主題風格不只一種', uniqStyles.size >= 4, [...uniqStyles].join('/'));
  const uniqMusic = new Set(LOCATIONS.map((l) => l.theme?.musicScale));

/* ── 12. 座位朝向（椅子不能亂轉）──────────────────────────── */
say('');
say('=== [12] 座位・椅子の向き ===');
{
  const gSeat = createGame({ locationId: 'tokyo_shibuya', seed: 3 });
  let bad = 0, checked = 0, worst = 1;
  for (const t of allTables(gSeat.plan)) {
    for (const sp of t.seatPos) {
      // 角色正面 = +Z，rotation.y = ry → 面向 (sin ry, cos ry)
      const fx = Math.sin(sp.ry), fz = Math.cos(sp.ry);
      const dx = t.x - sp.x, dz = t.z - sp.z;
      const d = Math.hypot(dx, dz) || 1;
      const dot = (fx * dx + fz * dz) / d;
      checked++;
      worst = Math.min(worst, dot);
      if (dot < 0.94) bad++;
    }
  }
  check('每個座位都面向桌心（椅子不再側擺）', bad === 0, `${checked} 個座位・最差 cos=${worst.toFixed(3)}`);
  const t0 = allTables(gSeat.plan)[0];
  const angles = t0.seatPos.map((s) => +s.ry.toFixed(3));
  check('四個座位朝向互不相同', new Set(angles).size === angles.length, angles.join(','));
}

  const NEW_KINDS = ['regular', 'solo', 'business', 'influencer', 'chefguest', 'club', 'nightworker', 'petlover'];
  check('追加客層が全部ある', NEW_KINDS.every((k) => CUSTOMER_KINDS[k]),
    NEW_KINDS.filter((k) => !CUSTOMER_KINDS[k]).join(',') || '8 種 OK');
  check('追加客層に時段と人数の設定がある',
    NEW_KINDS.every((k) => Object.keys(CUSTOMER_KINDS[k].hours || {}).length > 0 && CUSTOMER_KINDS[k].party.length === 2));
  check('追加客層は全地點に出られる（base 權重）', NEW_KINDS.every((k) => (CUSTOMER_KINDS[k].base || 0) > 0));
  const seenKinds = new Set();
  let guardK = 0;
  while (gK.phase !== 'settle' && guardK++ < 2000) {
    tick(gK, 1);
    for (const g of gK.groups) seenKinds.add(g.kind);
  }
  const newSeen = NEW_KINDS.filter((k) => seenKinds.has(k));
  check('新しい客層が実際に來店する', newSeen.length >= 5, `${newSeen.length}/8 種（${newSeen.join('、')}）`);
  check('ペット連れ客層は必ずペットを連れてくる', (() => {
    const g2 = createGame({ locationId: 'tokyo_shibuya', seed: 99 });
    let n = 0, withPet = 0;
    for (let i = 0; i < 6000 && n < 20; i++) {
      const g = spawnGroup(g2, locationById('tokyo_shibuya'));
      if (g.kind !== 'petlover') continue;
      n++;
      if (g.pet) withPet++;
    }
    return n > 0 && withPet === n;
  })());
  check('新客層の人物モデルが作れる', NEW_KINDS.every((k) => {
    try { const m = Chars.makeCharacter({ kind: k, seed: 7 }); return !!m && m.isObject3D; } catch { return false; }
  }));

  // ── 従業員 ──
  check('従業員が 44 名に増えた', STAFF_POOL.length === 44, `${STAFF_POOL.length} 名`);
  check('外場 24 名・料理人 20 名',
    STAFF_POOL.filter((s) => s.role === 'waiter').length === 24 && STAFF_POOL.filter((s) => s.role === 'chef').length === 20,
    `w ${STAFF_POOL.filter((s) => s.role === 'waiter').length} / c ${STAFF_POOL.filter((s) => s.role === 'chef').length}`);
  check('(role,speed,skill,stamina) が全員ユニーク',
    new Set(STAFF_POOL.map((s) => `${s.role}|${s.speed}|${s.skill}|${s.stamina}`)).size === STAFF_POOL.length,
    `${new Set(STAFF_POOL.map((s) => `${s.role}|${s.speed}|${s.skill}|${s.stamina}`)).size} 通り`);
  check('能力値が実数（99 固定になっていない）',
    STAFF_POOL.every((s) => s.speed >= 35 && s.speed <= 96 && s.skill >= 30 && s.skill <= 96 && s.stamina >= 30 && s.stamina <= 96),
    `speed ${Math.min(...STAFF_POOL.map((s) => s.speed))}..${Math.max(...STAFF_POOL.map((s) => s.speed))} / skill ${Math.min(...STAFF_POOL.map((s) => s.skill))}..${Math.max(...STAFF_POOL.map((s) => s.skill))}`);
  check('簽約金 = 時給 ×2', STAFF_POOL.every((s) => s.hireCost === Math.round(s.wage * 2 / 100) * 100));

  // ── 依頼（ミッション）──
  check('依頼が 27 件ある', MISSIONS.length >= 40, `${MISSIONS.length} 件`);
  check('依頼の id がユニーク', new Set(MISSIONS.map((m) => m.id)).size === MISSIONS.length);
  check('全依頼に目標と報酬がある',
    MISSIONS.every((m) => m.goal && m.goal.kind && m.goal.target > 0 && m.reward && Object.keys(m.reward).length > 0));
  check('tier 1..5 が全部埋まっている', [1, 2, 3, 4, 5].every((t) => MISSIONS.some((m) => m.tier === t)));
  const gM = createGame({ locationId: 'tokyo_shibuya', seed: 808 });
  const rep0 = missionReport(gM);
  check('開幕時は tier1 の依頼が出ている', rep0.active.length > 0 && rep0.unlockedTier === 1, `${rep0.active.length} 件進行中`);
  check('進捗が有限数', rep0.byTier.every((t) => t.missions.every((r) => Number.isFinite(r.progress.cur) && r.progress.target > 0)));
  let guardM = 0, missionEvents = 0;
  const cashBeforeM = gM.cash;
  while (gM.phase !== 'settle' && guardM++ < 2000) {
    tick(gM, 1);
    missionEvents += drainEvents(gM).filter((e) => e.type === 'mission').length;
  }
  const repS = missionReport(gM);
  check('営業すると依頼が達成される', repS.completedCount > 0, `${repS.completedCount} 件達成`);
  check('達成イベントが出る（音・トースト用）', missionEvents > 0, `${missionEvents} 件`);
  const first = repS.claimable[0];
  check('受取待ちが作られる', !!first, first ? `${first.mission.jp}` : '無');
  if (first) {
    const res = claimMission(gM, first.mission.id);
    check('報酬を受け取れる', res.ok === true && gM.cash > cashBeforeM, (res.got || []).join('・'));
    check('同じ依頼は二度受け取れない', claimMission(gM, first.mission.id).ok === false);
    check('受取済みが記録される', !!gM.missions.claimed[first.mission.id]);
  }
  check('達成 3 件ごとに tier が解放される', (() => {
    const g3 = createGame({ locationId: 'tokyo_shibuya', seed: 4242 });
    let guard = 0;
    while (g3.phase !== 'settle' && guard++ < 3000) tick(g3, 1);
    const n = Object.keys(g3.missions.completed).length;
    return g3.missions.unlockedTier === Math.max(1, Math.min(5, 1 + Math.floor(n / 3)));
  })());
  check('依頼の状態が存讀檔できる', (() => {
    const st = deserializeGame(serializeGame(gM));
    return Object.keys(st.missions.completed).length === Object.keys(gM.missions.completed).length
      && Object.keys(st.missions.claimed).length === Object.keys(gM.missions.claimed).length;
  })());

  // ── 天気 ──
  check('天気が 8 種類になった', WEATHERS.length === 8, WEATHERS.join(','));
  check('全天気に日本語名と客足倍率がある',
    WEATHERS.every((w) => typeof WEATHER_JP[w] === 'string' && Number.isFinite(WEATHER_TRAFFIC[w])),
    WEATHERS.map((w) => `${WEATHER_JP[w]}${Math.round(WEATHER_TRAFFIC[w] * 100)}%`).join(' '));
  check('立地データの天気割合は合計 100 のまま', LOCATIONS.every((l) => Object.values(l.weather).reduce((a, b) => a + b, 0) === 100));
  check('知らない天気は晴天に丸められる', (() => {
    const raw = serializeGame(gM);
    raw.weather = 'meteor';
    return deserializeGame(raw).weather === 'sunny';
  })());
  const weatherSeen = new Set();
  const gW = createGame({ locationId: 'sapporo_susukino', seed: 777 });
  for (let d = 0; d < 60; d++) {
    weatherSeen.add(gW.weather);
    gW.day += 1;
    gW.weather = rollWeather(gW);
  }
  const extraSeen = ['storm', 'heat', 'fog', 'sleet'].filter((w) => weatherSeen.has(w));
  check('季節で追加天気が出る', extraSeen.length >= 2, `${extraSeen.join('、') || '無'}（全 ${[...weatherSeen].join('、')}）`);
  check('燈光が全天気に対応している', (() => {
    try { for (const w of WEATHERS) lighting.setWeather(w); return true; } catch { return false; }
  })(), `${WEATHERS.length} 種`);
  lighting.setWeather('sunny');

  // ── 事件（イベント）──
  check('事件が 50 件に増えた', EVENTS.length >= 50, `${EVENTS.length} 件`);
  check('事件 id がユニーク', new Set(EVENTS.map((e) => e.id)).size === EVENTS.length);
  check('天気限定の事件がある', EVENTS.filter((e) => e.requireWeather).length >= 8,
    `${EVENTS.filter((e) => e.requireWeather).length} 件`);
}

/* ── 20. Cherish（スプライトシートの billboard 客）──────────────── */
say('');
say('=== [20] Cherish（billboard 客）===');
{
  const sheet = await import('../src/scene/actors.js');
  await sheet.loadSheets();
  const st = sheet.sheetStatus('cherish');
  check('Cherish のシートが読み込めた', st.state === 'ready', `${st.state}${st.error ? ' — ' + st.error : ''}`);
  check('6 コマに切り出せた', sheet.sheetFrameCount('cherish') === 6, `${sheet.sheetFrameCount('cherish')} コマ`);

  // 背景がクロマキーで抜けているか（テクスチャの canvas を直接見る）
  const preview = sheet.makeSheetCharacter('cherish');
  check('billboard スプライトを作れる', !!preview && preview.isSprite === true);
  if (preview) {
    check('足元が原点（center = 0.5, 0）', preview.center.x === 0.5 && preview.center.y === 0, `${preview.center.x},${preview.center.y}`);
    check('身長が人間サイズ（1.4〜1.9 m）', preview.scale.y > 1.4 && preview.scale.y < 1.9, `${preview.scale.y.toFixed(2)} m`);
    const cv = preview.material.map.image;
    const px = cv.getContext('2d').getImageData(0, 0, cv.width, cv.height).data;
    let transparent = 0;
    for (let i = 3; i < px.length; i += 4) if (px[i] === 0) transparent++;
    check('背景が透明になっている', transparent > 100, `透明 ${transparent} px`);
    // 反転版も作られている
    check('左右反転版がある', (() => {
      const ok = sheet.setSheetFrame(preview, 2, true);
      const mirrored = preview.userData.mirror === true && preview.userData.frame === 2;
      sheet.setSheetFrame(preview, 0, false);
      return ok && mirrored;
    })());
  }

  // 實際に店内へ出して描畫されるか
  const gC = createGame({ locationId: 'tokyo_shibuya', seed: 2468 });
  gC.simForce = true;
  const cam = new THREE.PerspectiveCamera(46, 1.6, 0.1, 400);
  cam.position.set(18, 14, 18);
  cam.lookAt(0, 1, 0);
  cam.updateMatrixWorld(true);
  // スプライトの客を 1 組つくる（spawnGroup の kind を Cherish に差し替え）
  const gc = spawnGroup(gC, locationById('tokyo_shibuya'));
  // 其他節の view が同じ id を使っているので、必ずユニークな id にする
  gc.id = 'g_cherish_test';
  gc.kind = 'cherish';
  gc.kindJp = 'Cherish';
  gc.sheet = 'cherish';
  gc.size = 1;
  gc.members = [gc.members[0]];
  gc.members[0].seat = -1;
  gc.walk = { x: 2.0, z: 5.0, speed: 1.2, dir: 0 };
  gc.members[0].x = 2.0;
  gc.members[0].z = 5.0;
  gc.members[0].ox = 0;
  gc.members[0].oz = 0;
  gC.groups.push(gc);
  view.update(0.016, gC, cam);
  const rec = view.groupMeshes.get(gc.id);
  check('Cherish のスプライトが場面に出る', !!(rec && rec.meshes[0] && rec.meshes[0].isSprite), rec ? `${rec.meshes.length} 体` : '無');
  if (rec && rec.meshes[0]) {
    const sp = rec.meshes[0];
    check('シートの客として印が付く', sp.userData.isSheetActor === true && sp.userData.kind === 'cherish');
    check('床の上に立っている（足元 y ≈ floorY）',
      Math.abs(sp.position.y - view.floorY) < 0.35, `y=${sp.position.y.toFixed(2)} floorY=${view.floorY.toFixed(2)}`);
    check('接地影が敷かれている', !!sp.userData.shadow);
    // 歩行でコマが進む（sim の syncMembers が付ける pose を再現してから時計を進める）
    gc.pose = 'walk';
    for (const m of gc.members) m.ry = 0;
    view.update(0.016, gC, cam);
    const f0 = sp.userData.frame;
    const seenFrames = new Set([f0]);
    for (let i = 0; i < 10; i++) {
      view.update(0.05, gC, cam);
      seenFrames.add(sp.userData.frame);
    }
    check('歩行でコマが切り替わる', seenFrames.size >= 3, `コマ ${[...seenFrames].join(',')}`);
    // カメラを反対側へ回すと左右反転が変わる
    const m0 = sp.userData.mirror;
    cam.position.set(-18, 14, -18);
    cam.lookAt(0, 1, 0);
    cam.updateMatrixWorld(true);
    view.update(0.016, gC, cam);
    check('カメラが回ると左右反転が切り替わる', sp.userData.mirror !== m0, `${m0} → ${sp.userData.mirror}`);
    // クリック判定（raycast）に載る
    check('クリック判定に使える形（Sprite + userData.kind）', !!sp.userData.kind && typeof sp.raycast === 'function');
    // 離店したら片付く（sim の tick と同じく配列からも外す）
    gc.state = 'gone';
    gC.groups = gC.groups.filter((x) => x.id !== gc.id);
    view.update(0.016, gC, cam);
    check('離店したらスプライトと影が片付く', !view.groupMeshes.has(gc.id), `${view.groupMeshes.size} 組殘留`);
  }
  // 客層としても定義されている（抽選・統計・看板に乗る）
  check('客層 cherish が定義されている', !!CUSTOMER_KINDS.cherish && CUSTOMER_KINDS.cherish.sheet === 'cherish');
  check('Cherish は一人客', CUSTOMER_KINDS.cherish.party[0] === 1 && CUSTOMER_KINDS.cherish.party[1] === 1);
}

/* ── 21. ペットスペース（ドッグラン）────────────────────────── */
say('');
stage('sec21'); say('=== [21] ペットスペース ===');
{
  const pets = await import('../src/sim/pets.js');
  const { petAreaOf, tickPets, petSummary, petAreaContains } = pets;

  // 帶寵物的組を手で作る（結果が安定するように席・テーブル・座標を固定）
  const mkPetGroup = (st, id) => {
    const g = spawnGroup(st, locationById('tokyo_shibuya'));
    g.id = id;
    g.pet = 'dog';
    g.petSeed = 4242;
    g.state = 'eating';
    g.floor = 0;
    g.tableId = 't7';             // 一樓ペット同伴席
    g.petTable = true;
    g.orders = [];
    g.eatLeft = 30;
    for (const m of g.members) { m.seat = 0; m.x = -4.9; m.z = 3.6; m.ry = Math.PI; }
    st.groups.push(g);
    return g;
  };

  /* ── 矩形 ── */
  const gA = createGame({ locationId: 'tokyo_shibuya', seed: 2024 });
  const area = petAreaOf(gA);
  check('ペットスペースの矩形がある',
    Number.isFinite(area.x) && Number.isFinite(area.z) && area.w > 1 && area.d > 0.8
    && Number.isFinite(area.cx) && Number.isFinite(area.cz),
    `中心 (${area.cx}, ${area.cz}) 寸法 ${area.w}×${area.d}`);
  const D0 = gA.plan.depth;
  const sideZ = gA.plan.outside?.z ?? D0 / 2 + 1.7;
  const paX0 = area.x - area.w / 2, paX1 = area.x + area.w / 2;
  const paZ0 = area.z - area.d / 2, paZ1 = area.z + area.d / 2;
  check('人行道（歩道 3.4 m）の中に収まっている',
    paZ0 >= sideZ - 1.7 && paZ1 <= sideZ + 1.7 && paX0 >= -13 && paX1 <= 13,
    `x ${paX0.toFixed(2)}..${paX1.toFixed(2)} / z ${paZ0.toFixed(2)}..${paZ1.toFixed(2)} / 歩道 z ${(sideZ - 1.7).toFixed(2)}..${(sideZ + 1.7).toFixed(2)}`);
  const q = gA.plan.queue;
  const qx0 = q.x - 0.6, qx1 = q.x - 0.6 + q.step * 4, qz0 = q.z - 1.0, qz1 = q.z + 0.2;
  const hitQueue = !(paX1 < qx0 || paX0 > qx1 || paZ1 < qz0 || paZ0 > qz1);
  check('候位レーン（行列の繩）と重ならない', !hitQueue,
    `ペット x ${paX0.toFixed(2)}..${paX1.toFixed(2)} / 候位 x ${qx0.toFixed(2)}..${qx1.toFixed(2)} z ${qz0.toFixed(2)}..${qz1.toFixed(2)}`);
  const entX = gA.plan.entrance.x;
  check('入口の動線（x ±1.2）を塞いでいない', paX1 < entX - 1.2 || paX0 > entX + 1.2,
    `ペット xMax ${paX1.toFixed(2)} < 入口 ${(entX - 1.2).toFixed(2)}`);
  check('店の奧行の外（歩道側）にある', paZ0 > D0 / 2, `z ${paZ0.toFixed(2)} > ${(D0 / 2).toFixed(2)}`);

  /* ── 行動：座っている組のペットは遊びに行く ── */
  const gB = createGame({ locationId: 'tokyo_shibuya', seed: 909 });
  const gP2 = mkPetGroup(gB, 'g_pet_play');
  let reached = false, inArea = true, sawOutside = false, doorOk = true, everOutside = false, crossX = NaN;
  for (let i = 0; i < 400 && !reached; i++) {
    const prevZ = Number.isFinite(gP2.petZ) ? gP2.petZ : null;
    tickPets(gB, 1);
    if (gP2.petState === 'toPlay' && Number.isFinite(gP2.petZ)) {
      if (gP2.petZ > D0 / 2) everOutside = true;
      if (prevZ !== null && prevZ <= D0 / 2 && gP2.petZ > D0 / 2) {
        sawOutside = true;
        crossX = gP2.petX;
        if (Math.abs(gP2.petX - entX) > 0.6) doorOk = false;   // 壁を突き抜けていないか
      }
    }
    if (gP2.petState === 'play') {
      reached = true;
      inArea = petAreaContains(area, gP2.petX, gP2.petZ);
    }
  }
  check('座っている組のペットが遊びに行く（petState=play）', reached,
    `state=${gP2.petState} 位置 (${Number(gP2.petX).toFixed(2)}, ${Number(gP2.petZ).toFixed(2)})`);
  check('遊んでいるペットはエリアの中にいる', inArea,
    `(${Number(gP2.petX).toFixed(2)}, ${Number(gP2.petZ).toFixed(2)}) / 中心 (${area.cx}, ${area.cz})`);
  check('ペットは扉を通って外へ出る（壁を突き抜けない）', sawOutside && doorOk && everOutside,
    `扉 x=${entX} / x=${Number(crossX).toFixed(2)}`);
  // 遊んでいる間ずっとエリアの中にいるか
  let stray = 0, hopMoved = false;
  let lastZ = gP2.petZ, lastX = gP2.petX;
  for (let i = 0; i < 40 && gP2.petState === 'play'; i++) {
    tickPets(gB, 1);
    if (gP2.petState !== 'play') break;
    if (!petAreaContains(area, gP2.petX, gP2.petZ)) stray++;
    if (Math.hypot(gP2.petX - lastX, gP2.petZ - lastZ) > 0.05) hopMoved = true;
    lastX = gP2.petX; lastZ = gP2.petZ;
  }
  check('遊んでいる間ずっと柵の中', stray === 0, `はみ出し ${stray} 回`);
  check('跳ね回る（位置が動く）', hopMoved, `最終 (${Number(gP2.petX).toFixed(2)}, ${Number(gP2.petZ).toFixed(2)})`);

  /* ── 定員（同時に遊べるのは 3 匹まで）── */
  const gC = createGame({ locationId: 'tokyo_shibuya', seed: 5 });
  const crowd = [];
  for (let i = 0; i < 5; i++) crowd.push(mkPetGroup(gC, 'g_pet_cap' + i));
  let maxPlaying = 0, crowdStray = 0;
  for (let i = 0; i < 900; i++) {
    tickPets(gC, 1);
    let playing = 0;
    for (const g of crowd) {
      if (g.petState !== 'play') continue;
      playing++;
      if (!petAreaContains(area, g.petX, g.petZ)) crowdStray++;
    }
    if (playing > maxPlaying) maxPlaying = playing;
  }
  check('同時に遊ぶのは 3 匹まで（定員）', maxPlaying <= 3 && maxPlaying >= 1, `最大 ${maxPlaying} 匹 / 定員 ${pets.PET_CAPACITY}`);
  check('5 匹いても柵の外へは出ない', crowdStray === 0, `はみ出し ${crowdStray} 回`);
  const sumC = petSummary(gC);
  check('petSummary が數値を返す',
    [sumC.playing, sumC.walking, sumC.mat].every(Number.isFinite) && sumC.capacity === 3 && !!sumC.area,
    `遊 ${sumC.playing} / 移動 ${sumC.walking} / マット ${sumC.mat} / 定員 ${sumC.capacity}`);
  const sumEmpty = petSummary(createGame({ locationId: 'tokyo_shibuya', seed: 3 }));
  check('ペットがいなければ 0（軽い）', sumEmpty.pets === 0 && sumEmpty.playing === 0 && sumEmpty.mat === 0);

  /* ── 座っていない狀態になったら戻る ── */
  const gD = createGame({ locationId: 'tokyo_shibuya', seed: 606 });
  const gP4 = mkPetGroup(gD, 'g_pet_back');
  for (let i = 0; i < 400 && gP4.petState !== 'play'; i++) tickPets(gD, 1);
  const wasPlaying = gP4.petState === 'play';
  const outX = gP4.petX, outZ = gP4.petZ;
  gP4.state = 'leaving';                       // 退店し始めた
  tickPets(gD, 1);
  check('座っていない狀態になったら戻り始める', wasPlaying && gP4.petState === 'back',
    `play → ${gP4.petState}（${Number(outX).toFixed(2)}, ${Number(outZ).toFixed(2)} から）`);
  let backSteps = 0;
  for (let i = 0; i < 200 && gP4.petState !== 'mat'; i++) { tickPets(gD, 1); backSteps++; }
  check('ペットは席（マット）まで戻る', gP4.petState === 'mat' && gP4.petX == null,
    `${backSteps} 分で state=${gP4.petState}`);

  /* ── 場面（3D）── */
  check('場面にペットスペースが建っている', !!view.petAreaGroup, view.petAreaGroup ? view.petAreaGroup.name : '無');
  let paMeshes = 0;
  if (view.petAreaGroup) view.petAreaGroup.traverse((o) => { if (o.isMesh) paMeshes++; });
  check('柵・芝生・看板・おもちゃが揃っている', paMeshes > 8, `${paMeshes} mesh`);
  check('場面とシミュレーションの矩形が一致',
    !!view.petArea && view.petArea.cx === area.cx && view.petArea.cz === area.cz && view.petArea.w === area.w,
    view.petArea ? `(${view.petArea.cx}, ${view.petArea.cz}) ${view.petArea.w}×${view.petArea.d}` : '無');
  check('遊んでいるペットのボールを持っている', !!view.petAreaBall, view.petAreaBall ? 'ok' : '無');

  const gS = createGame({ locationId: 'tokyo_shibuya', seed: 515 });
  const gP5 = mkPetGroup(gS, 'g_pet_scene');
  gP5.petState = 'play';
  gP5.petX = area.cx + 0.35;
  gP5.petZ = area.cz - 0.2;
  gP5.petDir = 1.2;
  gP5.petTimer = 5;
  const camP = new THREE.PerspectiveCamera(46, 1.6, 0.1, 400);
  camP.position.set(18, 14, 18);
  camP.lookAt(0, 1, 0);
  camP.updateMatrixWorld(true);
  view.update(0.016, gS, camP);
  const recP = view.groupMeshes.get(gP5.id);
  const petMesh = recP && recP.pets && recP.pets[0];
  check('遊んでいるペットが場面に出る', !!petMesh && petMesh.visible === true,
    recP ? `${recP.pets.length} 匹` : '無');
  if (petMesh) {
    check('ペットはエリアの中に置かれる', petAreaContains(view.petArea, petMesh.position.x, petMesh.position.z),
      `(${petMesh.position.x.toFixed(2)}, ${petMesh.position.z.toFixed(2)})`);
    check('ペットは歩道の高さにいる', Math.abs(petMesh.position.y - view.sidewalkY) <= 0.16,
      `y=${petMesh.position.y.toFixed(3)} / 歩道 ${view.sidewalkY}`);
    const ys = new Set();
    for (let i = 0; i < 8; i++) { view.update(0.09, gS, camP); ys.add(petMesh.position.y.toFixed(3)); }
    check('遊んでいると跳ねる（y が動く）', ys.size >= 3, `${ys.size} 通り`);
    const ball = view.petAreaBall;
    check('遊んでいる間はボールが出る', !!ball && ball.visible === true, ball ? `y=${ball.position.y.toFixed(2)}` : '無');
    check('ボールはペットのそばを転がる',
      !!ball && Math.hypot(ball.position.x - petMesh.position.x, ball.position.z - petMesh.position.z) < 1.5,
      ball ? `${Math.hypot(ball.position.x - petMesh.position.x, ball.position.z - petMesh.position.z).toFixed(2)} m` : '無');
    // 遊びが終わったらボールは引っ込む
    gP5.petState = 'back';
    view.update(0.016, gS, camP);
    check('遊びが終わるとボールは隠れる', !!ball && ball.visible === false);
    // 席へ戻ったらマットの位置に戻る（従來の動きを壊していない）
    gP5.petState = 'mat';
    gP5.petX = null;
    gP5.petZ = null;
    view.update(0.016, gS, camP);
    check('マットに戻ると席のそばに表示される',
      Math.abs(petMesh.position.z - gP5.members[0].z) < 1.6 && petMesh.position.y < 0.4,
      `(${petMesh.position.x.toFixed(2)}, ${petMesh.position.y.toFixed(2)}, ${petMesh.position.z.toFixed(2)})`);
  }

  // 統合：sim/game.js の tick() から呼ばれているか（この確認だけは tickPets を直接呼ばない）
  // ペット連れ客が必ず出るよう forceKind を使う（亂數の消費が変わっても安定する）
  const gE = createGame({ locationId: 'tokyo_shibuya', seed: 4242 });
  gE.forceKind = 'petlover';
  gE.forceKindLeft = 2;
  let wired = null, wiredMin = 0, petSeen = 0;
  for (let i = 0; i < 1400 && !wired; i++) {
    if (gE.phase === 'settle') { startNextDay(gE); gE.forceKind = 'petlover'; gE.forceKindLeft = 2; }
    tick(gE, 1);
    for (const g of gE.groups) {
      if (!g.pet) continue;
      petSeen++;
      if (g.petState === 'toPlay' || g.petState === 'play') { wired = g.petState; wiredMin = i + 1; break; }
    }
  }
  check('tick()（sim/game.js）からもペットが遊びに行く', !!wired,
    wired ? `${wiredMin} 分後に ${wired}` : `ペット連れ ${petSeen} 組を見たが toPlay にならない（tick に tickPets が未配線？）`);
}

say('');
/* ── 23. 洗手間の改修（グレードアップ）── */
say('');
say('=== [23] 洗手間の改修（グレード）===');
{
  const gT = createGame({ locationId: 'tokyo_shibuya', seed: 909 });
  check('初期グレードは和式（L0）', restroomLevel(gT, 0, 'm') === 0 && restroomLevelInfo(0).jp === '和式',
    `${restroomLevel(gT, 0, 'm')} / ${restroomLevelInfo(0).jp}`);
  const cash0 = gT.cash;
  const r1 = renovateRestroom(gT, 0, 'm');
  check('男性用を 1 段階改修できる', r1.ok && r1.level === 1 && gT.cash === cash0 - r1.cost,
    `${r1.jp} ${money(r1.cost)}`);
  const r2 = renovateFloorRestrooms(gT, 0);
  check('同じ階をまとめて改修（10% 割引）', r2.ok && r2.rooms.length >= 1,
    `${r2.rooms ? r2.rooms.length : 0} 部屋 / ${money(r2.cost || 0)}`);
  check('改修するとグレードが上がる', restroomLevel(gT, 0, 'm') + restroomLevel(gT, 0, 'f') >= 3,
    `m=L${restroomLevel(gT, 0, 'm')} f=L${restroomLevel(gT, 0, 'f')}`);
  // グレードが高いと汚れにくい（同じ seed・同じ條件で 1 日比較）
  const gLow = createGame({ locationId: 'tokyo_shibuya', seed: 909 });
  const gHigh = createGame({ locationId: 'tokyo_shibuya', seed: 909 });
  renovateRestroom(gHigh, 0, 'm');
  renovateRestroom(gHigh, 0, 'm');
  renovateRestroom(gHigh, 0, 'm');
  let i1 = 0, i2 = 0;
  while (gLow.phase !== 'settle' && i1++ < 1500) tick(gLow, 1);
  while (gHigh.phase !== 'settle' && i2++ < 1500) tick(gHigh, 1);
  const dLow = restroomDirt(gLow, 0, 'm');
  const dHigh = restroomDirt(gHigh, 0, 'm');
  check('最高グレードの部屋は汚れにくい', dHigh < dLow * 0.75, `L0=${dLow.toFixed(0)} / L3=${dHigh.toFixed(0)}`);
  check('平均グレードが取れる', avgRestroomLevel(gHigh) > 0.5, avgRestroomLevel(gHigh).toFixed(2));
  const rt = deserializeGame(serializeGame(gHigh));
  check('改修グレードは存讀檔される', restroomLevel(rt, 0, 'm') === restroomLevel(gHigh, 0, 'm'),
    `L${restroomLevel(rt, 0, 'm')}`);
  check('増築した階は L0 から始まる', (() => {
    const g3 = createGame({ locationId: 'tokyo_shibuya', seed: 5 });
    setFloorCount(g3, 2);
    return restroomList(g3).filter((r) => r.floor === 1).every((r) => r.level === 0);
  })());
  check('資金不足なら改修できない', (() => {
    const g4 = createGame({ locationId: 'tokyo_shibuya', seed: 6 });
    g4.cash = 1000;
    return renovateRestroom(g4, 0, 'f').ok === false;
  })());
}

/* ── 24. 屋外の天気エフェクト ── */
say('');
say('=== [24] 屋外の天気エフェクト ===');
{
  const wfx = buildWeatherFx(scene);
  const weatherFx = wfx;
  check('weatherfx モジュールが読み込める', !!wfx && typeof wfx.update === 'function');
  const kinds = ['sunny', 'rain', 'storm', 'snow', 'sleet', 'fog', 'heat'];
  let ok = true;
  for (const w of kinds) {
    try { weatherFx.update(0.05, w, false); } catch { ok = false; }
  }
  check('全天気でエフェクト更新が例外を出さない', ok, kinds.join(','));
  const stRain = (() => { weatherFx.update(0.05, 'rain'); return weatherFx.state(); })();
  const stStorm = (() => { weatherFx.update(0.05, 'storm'); return weatherFx.state(); })();
  const stSnow = (() => { weatherFx.update(0.05, 'snow'); return weatherFx.state(); })();
  const stSun = (() => { weatherFx.update(0.05, 'sunny'); return weatherFx.state(); })();
  check('雨のときは雨粒が出る', stRain.rain > 100, `rain=${stRain.rain}`);
  check('暴風雨は雨粒が多い', stStorm.rain > stRain.rain, `${stStorm.rain} > ${stRain.rain}`);
  check('雪のときは雪片が出る', stSnow.snow > 100, `snow=${stSnow.snow}`);
  check('晴れのときは何も出ない', stSun.rain === 0 && stSun.snow === 0, JSON.stringify(stSun));
}

stage('summary');
say(fails === 0 ? '<span class="pass">SCENE TEST: ALL PASSED</span>' : `<span class="fail">SCENE TEST: ${fails} FAILED</span>`);
out.innerHTML = L.join('\n');
document.title = fails === 0 ? 'SCENE-OK' : 'SCENE-FAIL-' + fails;
console.log('SCENE_TEST_RESULT fails=' + fails + ' meshes=' + meshes + ' calls=' + info.calls + ' tris=' + info.triangles);
</script>
