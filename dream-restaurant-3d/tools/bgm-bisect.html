<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><title>BGM 二分測試</title></head>
<body style="background:#14110f;color:#f3ece0;font:13px Consolas,monospace;padding:14px">
<pre id="out">running…</pre>
<script type="importmap">
{ "imports": { "three": "../vendor/three.module.js" } }
</script>
<script type="module">
import { scheduleMusic, renderRaw, windowStats } from '../src/audio/audio.js';

const out = document.getElementById('out');
const log = (t) => { out.textContent += '\n' + t; };
out.textContent = 'BGM variant: ' + (new URLSearchParams(location.search).get('v') || 'full');

function mulberry(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const V = new URLSearchParams(location.search).get('v') || 'full';
const wantTaiko = V === 'full' || V === 'taiko';
const wantMelody = V === 'full' || V === 'melody';
const wantShaku = V === 'full' || V === 'shaku';

/* 直接複製 scheduleMusic 的結構，但可以個別關掉聲部 */
function build(ctx, dest, startTime, seconds, rnd) {
  const scale = [0, 2, 4, 7, 9];
  const root = 57;
  const beat = 60 / 96;
  let t = startTime;
  let deg = 0;
  const end = startTime + seconds;
  if (wantTaiko) {
    for (let b = 0; t + b * beat * 4 < end; b++) {
      const tt = startTime + b * beat * 4;
      if (tt >= end) break;
      const o = ctx.createOscillator();
      o.type = 'sine';
      o.frequency.setValueAtTime(120, tt);
      o.frequency.exponentialRampToValueAtTime(52, tt + 0.28);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, tt);
      g.gain.exponentialRampToValueAtTime(0.12, tt + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, tt + 0.42);
      o.connect(g); g.connect(dest);
      o.start(tt); o.stop(tt + 0.5);
    }
  }
  if (wantMelody) {
    while (t < end) {
      const step = beat * (rnd() < 0.45 ? 0.5 : 1) * 1.2;
      deg += Math.floor(rnd() * 5) - 2;
      const midi = root + scale[((deg % 5) + 5) % 5];
      const o = ctx.createOscillator();
      o.type = 'triangle';
      o.frequency.value = 440 * Math.pow(2, (midi - 69) / 12);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.13, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + step * 1.6);
      o.connect(g); g.connect(dest);
      o.start(t); o.stop(t + step * 1.6 + 0.02);
      t += step;
    }
  }
  if (wantShaku) {
    for (let i = 0; startTime + i * beat * 4 < end; i++) {
      const tt = startTime + i * beat * 4;
      const o = ctx.createOscillator();
      o.type = 'sine';
      o.frequency.value = 220;
      const vib = ctx.createOscillator();
      vib.frequency.value = 4.6;
      const vg = ctx.createGain(); vg.gain.value = 1.3;
      vib.connect(vg); vg.connect(o.frequency);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, tt);
      g.gain.exponentialRampToValueAtTime(0.05, tt + 0.3);
      g.gain.exponentialRampToValueAtTime(0.0001, tt + 0.7);
      o.connect(g); g.connect(dest);
      o.start(tt); o.stop(tt + 0.72);
      vib.start(tt); vib.stop(tt + 0.72);
    }
  }
}

log('scheduling…');
const t0 = performance.now();
const raw = V === 'real'
  ? await renderRaw(0.8, (ctx, dest) => scheduleMusic(ctx, dest, 0, 0.75, { scale: 'yo', root: 57, bpm: 96, density: 0.8, night: false, random: mulberry(7) }))
  : await renderRaw(0.8, (ctx, dest) => build(ctx, dest, 0, 0.75, mulberry(7)));
log('rendered in ' + Math.round(performance.now() - t0) + ' ms');
if (!raw) { log('RESULT: renderRaw returned null'); }
else {
  const s = windowStats(raw.data, raw.sampleRate, 0, 0.8);
  log('peak=' + s.peak + ' rms=' + s.rms + ' silent=' + s.silent);
  log(s.silent ? 'RESULT: SILENT' : 'RESULT: OK');
}
document.title = 'BGM-' + V + '-done';
</script>
</body>
</html>
