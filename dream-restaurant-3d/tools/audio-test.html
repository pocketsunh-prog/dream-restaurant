<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>音訊驗證 — Dream Restaurant 3D</title>
<style>
  body { background: #14110f; color: #f3ece0; font: 13px/1.75 Consolas, monospace; margin: 0; padding: 14px; }
  h1 { font-size: 15px; color: #c9a227; margin: 0 0 8px; }
  pre { white-space: pre-wrap; margin: 0; }
  .pass { color: #8ef0a0; } .fail { color: #ff9090; } .info { color: #9fb0c4; }
</style>
</head>
<body>
<h1>Dream Restaurant 3D — 音訊驗證（OfflineAudioContext 實際渲染）</h1>
<pre id="out">running…</pre>
<script type="importmap">
{ "imports": {
  "three": "../vendor/three.module.js",
  "three/addons/environments/RoomEnvironment.js": "../vendor/RoomEnvironment.js"
} }
</script>
<script type="module">
import {
  renderRaw, windowStats, renderOffline, synthSfx, scheduleMusic,
  SFX_NAMES, SCALES, LOCALE_SCALE, AudioEngine
} from '../src/audio/audio.js';
import { LOCATIONS } from '../src/data/locations.js';

const out = document.getElementById('out');
const L = [];
let fails = 0;
const say = (t) => { L.push(t); out.innerHTML = L.join('\n'); };
const check = (name, ok, detail = '') => {
  if (!ok) fails++;
  say(`  ${ok ? 'PASS' : 'FAIL'}  ${name}${detail ? ' :: ' + detail : ''}`);
};
addEventListener('error', (e) => { fails++; say(`  FAIL  未捕捉例外 :: ${e.message} @${e.lineno}`); });
addEventListener('unhandledrejection', (e) => { fails++; say(`  FAIL  Promise :: ${e.reason?.message || e.reason}`); });

/* ── 1. 環境 ─────────────────────────────────────────────── */
say('=== [1] 環境 ===');
check('OfflineAudioContext 可用', !!(window.OfflineAudioContext || window.webkitOfflineAudioContext));
check('AudioContext 可用', !!(window.AudioContext || window.webkitAudioContext));
/* 這台環境的 headless Chrome 對「同一頁第 2 個 OfflineAudioContext」會卡住，
   所以一次載入只做一次離線渲染，用 ?t=sfx / ?t=music 分段驗證（結果合起來才是完整驗證）。 */
const PART = new URLSearchParams(location.search).get('t') || 'sfx';
say('（本次驗證區段：' + PART + '）');

if (PART === 'sfx') {
/* ── 2. 音效：一次渲染排入全部 SFX，再依時間窗統計 ───────── */
say('');
say('=== [2] 音效合成（一次渲染、分窗量測）===');
const SFX_WIN = 0.135;   // 短窗：一次渲染全部塞進約 2 秒，避免累積 audio context
say(`  …離線渲染 ${(SFX_NAMES.length * SFX_WIN + 0.15).toFixed(2)} 秒（14 個音效排在不同時間點）`);
let sfxRaw = null;
try {
  sfxRaw = await renderRaw(SFX_NAMES.length * SFX_WIN + 0.15, (ctx, dest) => {
    SFX_NAMES.forEach((n, i) => synthSfx(ctx, dest, n, 0.05 + i * SFX_WIN));
  });
} catch (e) {
  say(`  FAIL  渲染失敗 :: ${e.message}`);
  fails++;
}
if (!sfxRaw) {
  check('離線渲染可用', false, 'renderRaw 回傳 null');
} else {
  SFX_NAMES.forEach((n, i) => {
    const s = windowStats(sfxRaw.data, sfxRaw.sampleRate, 0.05 + i * SFX_WIN, 0.05 + (i + 1) * SFX_WIN);
    check(`SFX ${n}`, !s.silent && s.peak <= 1.0 && s.clipped === 0,
      `peak ${s.peak} rms ${s.rms} 非零 ${(s.nonZeroRatio * 100).toFixed(0)}%`);
  });
}
}

if (PART === 'music') {
/* ── 3. 音樂：一次載入只渲染一個音階（離線渲染很耗 CPU，縮到 0.3 秒音訊）── */
say('');
const CASES = {
  yo:     { label: 'yo 白天',     opts: { scale: 'yo',     root: 57, bpm: 96, density: 0.8, night: false } },
  in:     { label: 'in 白天',     opts: { scale: 'in',     root: 55, bpm: 84, density: 0.6, night: false } },
  miyako: { label: 'miyako 白天', opts: { scale: 'miyako', root: 57, bpm: 88, density: 0.7, night: false } },
  night:  { label: 'miyako 夜晚', opts: { scale: 'miyako', root: 52, bpm: 58, density: 0.3, night: true } }
};
const which = new URLSearchParams(location.search).get('scale') || 'yo';
const CASE = CASES[which] || CASES.yo;
say('=== [3] BGM 合成 — ' + CASE.label + ' ===');
const SEC = 0.3;
say('  …離線渲染 ' + SEC + ' 秒音樂（headless 軟體音訊約需數秒 CPU）');
let musicRaw = null;
try {
  musicRaw = await renderRaw(SEC + 0.05, (ctx, dest) => {
    scheduleMusic(ctx, dest, 0, SEC, { ...CASE.opts, random: mulberry(7) });
  });
} catch (e) {
  say('  FAIL  音樂渲染失敗 :: ' + e.message);
  fails++;
}
if (!musicRaw) {
  check('音樂離線渲染可用', false, 'renderRaw 回傳 null');
} else {
  const st = windowStats(musicRaw.data, musicRaw.sampleRate, 0, SEC);
  check('BGM ' + CASE.label, !st.silent && st.peak <= 1.0 && st.nonZeroRatio > 0.05,
    'peak ' + st.peak + ' rms ' + st.rms + ' 非零 ' + (st.nonZeroRatio * 100).toFixed(0) + '%');
  check('沒有破音（clipping）', st.clipped === 0, st.clipped + ' 個樣本 > 0.999');
}
}

/** 測試用可重現亂數 */
function mulberry(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ── 4. 引擎行為 ─────────────────────────────────────────── */
say('');
say('=== [4] 引擎 ===');
const eng = new AudioEngine({ volumes: { music: 0.4, sfx: 0.6 } });
check('未啟用時 state 正確', eng.state().enabled === false && eng.state().musicPlaying === false);
check('未啟用時 playSfx 安全回傳 null', eng.playSfx('click') === null);
check('音量夾在 0..1', eng.setVolume('sfx', 5) === 1 && eng.setVolume('sfx', -3) === 0);
eng.setMusicMood({ scale: 'nonexistent', bpm: 999, density: 5 });
check('setMusicMood 夾住非法值',
  eng._musicOpts.scale === 'yo' && eng._musicOpts.bpm <= 120 && eng._musicOpts.density <= 1,
  `scale=${eng._musicOpts.scale} bpm=${eng._musicOpts.bpm} density=${eng._musicOpts.density}`);
check('SFX 名稱清單完整', SFX_NAMES.length >= 12, `${SFX_NAMES.length} 種`);

/* ── 5. 立地 → 音階 ──────────────────────────────────────── */
say('');
say('=== [5] 立地 → 音階 ===');
const kinds = [...new Set(LOCATIONS.map((l) => l.kind))];
const unmapped = kinds.filter((k) => !LOCALE_SCALE[k]);
check('每個立地類型都有對應音階', unmapped.length === 0, unmapped.join(',') || `${kinds.length} 種類型全部對到`);
check('音階定義 >= 4 種', Object.keys(SCALES).length >= 4, Object.keys(SCALES).join('/'));

/* ── 6. 事件整合 ─────────────────────────────────────────── */
say('');
say('=== [6] 事件整合 ===');
{
  const { createGame, tick, drainEvents } = await import('../src/sim/game.js');
  const g = createGame({ locationId: 'tokyo_shibuya', seed: 3 });
  drainEvents(g);
  let guard = 0;
  const seen = new Set();
  while (guard++ < 900 && g.phase === 'open') {
    tick(g, 1);
    for (const ev of drainEvents(g)) seen.add(ev.type);
  }
  const wanted = ['door', 'seat', 'order', 'serve', 'pay'];
  const missing = wanted.filter((t) => !seen.has(t));
  check('模擬會產生音效事件', missing.length === 0,
    missing.length ? '缺少 ' + missing.join(',') : [...seen].join(','));
}

say('');
say(fails === 0 ? '<span class="pass">AUDIO TEST: ALL PASSED</span>' : `<span class="fail">AUDIO TEST: ${fails} FAILED</span>`);
document.title = fails === 0 ? 'AUDIO-OK' : 'AUDIO-FAIL-' + fails;
console.log('AUDIO_TEST fails=' + fails);
</script>
</body>
</html>
